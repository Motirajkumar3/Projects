<!DOCTYPE html>
<html>
<head>
    <title>Website Text Summarizer</title>
    <style>
        body { background-color: #121212; color: #f0f0f0; font-family: Arial; text-align: center; padding: 40px; }
        input[type="text"] { width: 60%; padding: 10px; font-size: 1em; }
        input[type="submit"] { padding: 10px 20px; font-size: 1em; background-color: #1f1f1f; color: #fff; border: none; cursor: pointer; }
        .summary-box { margin-top: 20px; padding: 20px; background-color: #222; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Website Text Summarizer</h1>
    <form method="post">
        <label>Enter a Website URL:</label><br><br>
        <input type="text" name="url" value="{{ url }}" required />
        <br><br>
        <input type="submit" value="Summarize" />
    </form>
    {% if summary %}
        <div class="summary-box">
            <h3>Summary for URL: {{ url }}</h3>
            <p>{{ summary }}</p>
        </div>
    {% endif %}
</body>
</html>
