<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSE GPA & CGPA Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h1, h2 {
      color: #51f981;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
    }
    select, input {
      background-color: #2a2a2a;
      color: white;
    }
    .form-select, .form-control {
      border: none;
    }
    .btn-custom {
      background-color: #00bcd4;
      color: black;
      font-weight: bold;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="text-center">CSE GPA & CGPA Calculator</h1>

  <h2>GPA Calculator</h2>
  <div id="gpa-section">
    <span>Select subjects, grades, and credits:</span>
    <div id="subjects" class="row g-2 mb-2">
      <div class="col-md-4">
        <select class="form-select sub-name">
          <option selected disabled>Subject</option>
          <option>DSA</option>
          <option>OOPs</option>
          <option>DBMS</option>
          <option>OS</option>
          <option>CN</option>
          <option>AI</option>
          <option>ML</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select sub-grade">
          <option selected disabled>Grade</option>
          <option value="10">O</option>
          <option value="9">A+</option>
          <option value="8">A</option>
          <option value="7">B+</option>
          <option value="6">B</option>
          <option value="0">RA</option>
        </select>
      </div>
      <div class="col-md-4">
        <input type="number" class="form-control sub-credits" placeholder="Credits" min="1" max="5">
      </div>
    </div>
    <button class="btn btn-sm btn-primary" onclick="addSubject()">+ Add Subject</button>
    <button class="btn btn-sm btn-success ms-2" onclick="calculateGPA()">Calculate GPA</button>
    <div class="result" id="gpa-result"></div>
  </div>

  <hr class="my-4">

  <h2>CGPA Calculator</h2>
  <div id="cgpa-section">
    <p>Enter GPA and credits for each semester:</p>
    <div class="row g-2 mb-2" id="semesters">
      <div class="col-md-6">
        <input type="number" step="0.01" class="form-control sem-gpa" placeholder="Semester GPA">
      </div>
      <div class="col-md-6">
        <input type="number" class="form-control sem-credits" placeholder="Semester Credits">
      </div>
    </div>
    <button class="btn btn-sm btn-primary" onclick="addSemester()">+ Add Semester</button>
    <button class="btn btn-sm btn-success ms-2" onclick="calculateCGPA()">Calculate CGPA</button>
    <div class="result" id="cgpa-result"></div>
  </div>
</div>

<script>
  function addSubject() {
    const container = document.getElementById("subjects");
    const row = document.createElement("div");
    row.className = "row g-2 mb-2";
    row.innerHTML = `
      <div class="col-md-4">
        <select class="form-select sub-name">
          <option selected disabled>Subject</option>
          <option>DSA</option>
          <option>OOPs</option>
          <option>DBMS</option>
          <option>OS</option>
          <option>CN</option>
          <option>AI</option>
          <option>ML</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select sub-grade">
          <option selected disabled>Grade</option>
          <option value="10">O</option>
          <option value="9">A+</option>
          <option value="8">A</option>
          <option value="7">B+</option>
          <option value="6">B</option>
          <option value="0">RA</option>
        </select>
      </div>
      <div class="col-md-4">
        <input type="number" class="form-control sub-credits" placeholder="Credits" min="1" max="5">
      </div>
    `;
    container.appendChild(row);
  }

  function calculateGPA() {
    const grades = document.querySelectorAll('.sub-grade');
    const credits = document.querySelectorAll('.sub-credits');

    let totalCredits = 0, totalPoints = 0;

    for (let i = 0; i < grades.length; i++) {
      const gp = parseFloat(grades[i].value);
      const credit = parseFloat(credits[i].value);
      if (!isNaN(gp) && !isNaN(credit)) {
        totalPoints += gp * credit;
        totalCredits += credit;
      }
    }

    const gpa = (totalPoints / totalCredits).toFixed(2);
    document.getElementById('gpa-result').innerText = totalCredits ? `Your GPA is ${gpa}` : "Please enter valid data.";
  }

  function addSemester() {
    const container = document.getElementById("semesters");
    const row = document.createElement("div");
    row.className = "row g-2 mb-2";
    row.innerHTML = `
      <div class="col-md-6">
        <input type="number" step="0.01" class="form-control sem-gpa" placeholder="Semester GPA">
      </div>
      <div class="col-md-6">
        <input type="number" class="form-control sem-credits" placeholder="Semester Credits">
      </div>
    `;
    container.appendChild(row);
  }

  function calculateCGPA() {
    const gpas = document.querySelectorAll('.sem-gpa');
    const credits = document.querySelectorAll('.sem-credits');

    let totalPoints = 0, totalCredits = 0;

    for (let i = 0; i < gpas.length; i++) {
      const gpa = parseFloat(gpas[i].value);
      const credit = parseFloat(credits[i].value);
      if (!isNaN(gpa) && !isNaN(credit)) {
        totalPoints += gpa * credit;
        totalCredits += credit;
      }
    }

    const cgpa = (totalPoints / totalCredits).toFixed(2);
    document.getElementById('cgpa-result').innerText = totalCredits ? `Your CGPA is ${cgpa}` : "Please enter valid data.";
  }
</script>
</body>
</html>
